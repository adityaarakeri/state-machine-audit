name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint skills
        run: npm run lint
      - name: Test scorer and parser
        run: npm test
      - name: Build adapters
        run: npm run build
      - name: Smoke test installer
        run: |
          SKILL_TARGETS="$RUNNER_TEMP/a:$RUNNER_TEMP/b" bash scripts/install.sh
          test -f "$RUNNER_TEMP/a/state-machine-audit/SKILL.md"
          test -f "$RUNNER_TEMP/b/state-machine-audit/references/audit-vectors.md"
          SKILL_TARGETS="$RUNNER_TEMP/a" bash scripts/install.sh --uninstall
          test ! -e "$RUNNER_TEMP/a/state-machine-audit"
      - name: Smoke test eval runner (stand-in agent, no model)
        run: |
          node evals/run-eval.mjs --fixtures react-shop \
            --cmd "cp $GITHUB_WORKSPACE/evals/test/golden/react-shop.REPORT.md REPORT.md # {prompt}"
      - uses: actions/upload-artifact@v4
        with:
          name: adapters
          path: dist/

  # Real-model evals cost money and need a key, so they only run on demand.
  # Add ANTHROPIC_API_KEY as a repo secret, then trigger from the Actions tab.
  eval:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @anthropic-ai/claude-code
      - run: npm run eval:claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
